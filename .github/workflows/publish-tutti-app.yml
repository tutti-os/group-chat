name: Publish Tutti App Production

on:
  workflow_dispatch:
    inputs:
      release_bump:
        description: Semver bump to publish.
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      publish_catalog:
        description: Whether to publish the production App Center catalog after this release.
        required: false
        type: boolean
        default: true
      catalog_only:
        description: Whether to skip app release upload and only publish the existing latest release to catalog.
        required: false
        type: boolean
        default: false
      prepare_only:
        description: Whether to prepare and attest a production candidate without publishing it.
        required: false
        type: boolean
        default: false
      candidate_run_id:
        description: Workflow run ID containing the prepared production candidate to publish.
        required: false
        type: string
        default: ""
      expected_version:
        description: Exact release version expected from the production candidate.
        required: false
        type: string
        default: ""
      expected_artifact_sha256:
        description: SHA-256 expected for the prepared production artifact.
        required: false
        type: string
        default: ""
      expected_git_sha:
        description: Exact source commit expected for the production candidate.
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  publish:
    uses: tutti-os/tutti/.github/workflows/publish-tutti-app-release.yml@main
    with:
      app_id: group-chat
      min_tutti_version: "0.1.18"
      package_command: pnpm package:tutti
      package_dir: build/tutti-app/package
      icon_path: build/tutti-app/package/icon.png
      release_tag_prefix: group-chat-v
      release_bump: ${{ inputs.release_bump }}
      create_release_tag: ${{ !inputs.catalog_only && !inputs.prepare_only }}
      prepare_only: ${{ inputs.prepare_only }}
      candidate_run_id: ${{ inputs.candidate_run_id }}
      expected_version: ${{ inputs.expected_version }}
      expected_artifact_sha256: ${{ inputs.expected_artifact_sha256 }}
      expected_git_sha: ${{ inputs.expected_git_sha }}
      runner: macos-latest
      pnpm_version: 10.11.0
      release_tools_package: "@tutti-os/app-release-tools@0.0.412"
      aws_region: ${{ vars.TUTTI_APP_RELEASES_PRODUCTION_AWS_REGION || vars.TUTTI_APP_RELEASES_AWS_REGION }}
      aws_role_arn: ${{ vars.TUTTI_APP_RELEASES_PRODUCTION_AWS_ROLE_ARN || vars.TUTTI_APP_RELEASES_AWS_ROLE_ARN }}
      s3_bucket: ${{ vars.TUTTI_APP_RELEASES_PRODUCTION_S3_BUCKET || vars.TUTTI_APP_RELEASES_S3_BUCKET }}
      s3_prefix: ${{ vars.TUTTI_APP_RELEASES_PRODUCTION_S3_PREFIX || vars.TUTTI_APP_RELEASES_S3_PREFIX }}
      release_assets_base_url: ${{ vars.TUTTI_APP_RELEASES_PRODUCTION_BASE_URL || vars.TUTTI_APP_RELEASES_BASE_URL }}
      publish_catalog: ${{ inputs.publish_catalog }}
      catalog_only: ${{ inputs.catalog_only }}
      catalog_cloudfront_distribution_id: ${{ vars.TUTTI_APP_RELEASES_PRODUCTION_CLOUDFRONT_DISTRIBUTION_ID || vars.TUTTI_APP_RELEASES_CLOUDFRONT_DISTRIBUTION_ID || '' }}
